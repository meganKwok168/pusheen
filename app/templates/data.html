<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Visualization</title>
    <link rel="stylesheet" href="{{url_for('static',filename='styles.css')}}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/foundation-sites@6.8.1/dist/css/foundation.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/foundicons/3.0.0/foundation-icons.min.css" crossorigin="anonymous">
    <style>
        .icon-bar {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #333;
            border-radius: 5px;
            padding: 10px;
            z-index: 100;
        }

        .icon-bar a {
            display: block;
            color: white;
            padding: 10px;
            text-align: center;
            text-decoration: none;
        }

        .icon-bar a:hover {
            background: #555;
        }

        .icon-bar i {
            margin-right: 5px;
        }
    </style>
</head>
<body>
    <h2>{{ Limit }} visualization</h2>
    <h2>{{ Specification }} v. {{ Metric }}</h2>
    <div class="icon-bar">
        {% if session['username'] %}
		 <a href="/logout"><i class="fi-power"></i> Logout</a>
        {% else %}
        <a href="/"><i class="fi-key"></i> Login</a>
        <a href="/createaccount"><i class="fi-clipboard-pencil"></i> Sign Up</a>
        {% endif %}
    </div>

  <div id="scatter"></div>
    <div id="avg"></div>
    <form action="/data">
        <input type="text", name="limit" id="limit" placeholder="What data do you want to limit your inquiry to?" required>
        <input type="text" name="specification" id="specification" placeholder="Enter a specification" required>
        <input type="text" name="metric" id="metric" placeholder="Enter a Metric" required>
        <button type="submit">Submit</button>
    </form>
    


<script src="https://d3js.org/d3.v7.min.js"></script>
    <script>
        const limit = {{ Limit | tojson }};
        const metric = {{ Metric | tojson }};
        const specification = {{ Specification | tojson }};

        fetch(`/api/data?limit=${encodeURIComponent(limit)}&metric=${encodeURIComponent(metric)}&specification=${encodeURIComponent(specification)}`)
            .then(res => res.json())
            .then(data => {
                drawScatter(data.scatter, specification, metric, "#scatter", "All Data");
                drawScatter(data.avg, specification, metric, "#avg", "Averages");
            });
function drawScatter(data, x, y, container, title) {
    const width = 600, height = 400;
    const margin = { top: 30, right: 20, bottom: 80, left: 60 };

    const svg = d3.select(container).append("svg")
        .attr("width", width).attr("height", height);

    svg.append("text")
        .attr("x", width / 2).attr("y", margin.top / 2)
        .attr("text-anchor", "middle")
        .text(title);

    const isText = typeof data[0][x] === "string";

    const xScale = isText
        ? d3.scaleBand()
            .domain(data.map(d => d[x]))
            .range([margin.left, width - margin.right])
            .padding(0.2)
        : d3.scaleLinear()
            .domain(d3.extent(data, d => d[x]))
            .range([margin.left, width - margin.right]);

    const yScale = d3.scaleLinear()
        .domain([0, d3.max(data, d => d[y])])
        .range([height - margin.bottom, margin.top]);

    svg.selectAll("circle")
        .data(data)
        .enter().append("circle")
        .attr("cx", d => isText ? xScale(d[x]) + xScale.bandwidth() / 2 : xScale(d[x]))
        .attr("cy", d => yScale(d[y]))
        .attr("r", 4)
        .attr("fill", "steelblue")
        .attr("opacity", 0.6);

    svg.append("g")
        .attr("transform", `translate(0, ${height - margin.bottom})`)
        .call(d3.axisBottom(xScale))
        .selectAll("text")
        .attr("transform", "rotate(-35)")
        .style("text-anchor", "end");

    svg.append("g")
        .attr("transform", `translate(${margin.left}, 0)`)
        .call(d3.axisLeft(yScale));

    svg.append("text")
        .attr("x", width / 2).attr("y", height - 5)
        .attr("text-anchor", "middle").text(x);

    svg.append("text")
        .attr("transform", "rotate(-90)")
        .attr("x", -height / 2).attr("y", 15)
        .attr("text-anchor", "middle").text(y);
}
    </script>

</body>
</html>
